<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Admin sign in for ፈለገሕይወት መዝሙር ክፍል Sunday School Choir Program."/>
  <title>Sign In — ፈለገሕይወት መዝሙር ክፍል</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <style>
    .password-wrap { position: relative; }
    .password-toggle {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      color: var(--clr-text-muted);
      background: none; border: none; cursor: pointer;
      padding: 4px;
      display: flex; align-items: center;
      transition: color var(--t-fast);
    }
    .password-toggle:hover { color: var(--clr-primary); }
    .alert-banner {
      padding: var(--sp-3) var(--sp-4);
      border-radius: var(--r-md);
      font-size: var(--fs-sm);
      display: flex; align-items: flex-start; gap: var(--sp-2);
      margin-bottom: var(--sp-5);
    }
    .alert-error   { background: var(--clr-error-bg);   color: var(--clr-error); border: 1px solid #FFCDD2; }
    .alert-success { background: var(--clr-success-bg); color: var(--clr-success); border: 1px solid #C8E6C9; }
    .login-decoration {
      position: absolute;
      pointer-events: none;
      opacity: 0.08;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: var(--sp-2);
      color: rgba(245,235,224,0.7);
      font-size: var(--fs-sm);
      position: absolute;
      top: var(--sp-5);
      left: var(--sp-5);
      transition: color var(--t-fast);
    }
    .back-link:hover { color: var(--clr-cream); }
  </style>
</head>
<body>
  <div class="login-page" role="main">
    <a href="index.html" class="back-link" aria-label="Back to homepage">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
      Back to Home
    </a>

    <div class="login-card" role="form" aria-label="Admin login">
      <div class="login-logo-wrap">
        <img src="assets/logo.png" alt="ፈለገሕይወት Church Logo" class="login-logo"/>
        <h1 class="login-title">Welcome Back</h1>
        <p class="login-sub ethiopic" style="color: var(--clr-primary); font-weight: 600;">ፈለገሕይወት መዝሙር ክፍል</p>
        <p class="login-sub" style="margin-top: 4px;">Sign in to access the admin dashboard</p>
      </div>

      <div id="errorBanner" class="alert-banner alert-error hidden" role="alert" aria-live="assertive">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span id="errorMsg">Invalid credentials.</span>
      </div>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label class="form-label" for="emailInput">
            Email Address <span class="required" aria-hidden="true">*</span>
          </label>
          <input
            type="email"
            id="emailInput"
            class="form-control"
            placeholder="admin@felege.com"
            autocomplete="email"
            aria-required="true"
            aria-describedby="emailError"
          />
          <div class="form-error hidden" id="emailError" role="alert">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span>Please enter a valid email address.</span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="passwordInput">
            Password <span class="required" aria-hidden="true">*</span>
          </label>
          <div class="password-wrap">
            <input
              type="password"
              id="passwordInput"
              class="form-control"
              placeholder="Enter your password"
              autocomplete="current-password"
              aria-required="true"
              aria-describedby="passwordError"
              style="padding-right: 44px"
            />
            <button type="button" class="password-toggle" id="togglePassword" aria-label="Show password">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="form-error hidden" id="passwordError" role="alert">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            <span>Password is required.</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-full btn-lg" id="submitBtn" style="margin-top: var(--sp-2)">
          <span id="submitLabel">Sign In</span>
          <span id="submitSpinner" class="hidden">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation: spin 0.8s linear infinite"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
          </span>
        </button>
      </form>

      <div class="login-footer-link">
        <a href="index.html">← Back to Homepage</a>
      </div>

      <div style="margin-top: var(--sp-5); padding: var(--sp-4); background: var(--clr-cream); border-radius: var(--r-md); font-size: var(--fs-xs); color: var(--clr-text-muted); text-align: center;">
        <strong style="display:block; margin-bottom: 4px; color: var(--clr-text)">Default Admin Credentials</strong>
        Email: admin@felege.com<br/>Password: Admin@2024
      </div>
    </div>
  </div>

  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script src="js/auth.js"></script>
  <script>
    // Redirect if already logged in
    if (AUTH.isAuthenticated()) {
      const dest = sessionStorage.getItem('fmk_redirect') || 'dashboard.html';
      sessionStorage.removeItem('fmk_redirect');
      window.location.href = dest;
    }

    const form       = document.getElementById('loginForm');
    const emailInput = document.getElementById('emailInput');
    const passInput  = document.getElementById('passwordInput');
    const submitBtn  = document.getElementById('submitBtn');
    const errorBanner = document.getElementById('errorBanner');
    const errorMsg   = document.getElementById('errorMsg');
    const togglePwd  = document.getElementById('togglePassword');

    // Password toggle
    togglePwd.addEventListener('click', () => {
      const isText = passInput.type === 'text';
      passInput.type = isText ? 'password' : 'text';
      togglePwd.setAttribute('aria-label', isText ? 'Show password' : 'Hide password');
      document.getElementById('eyeIcon').innerHTML = isText
        ? `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`
        : `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;
    });

    function showFieldError(inputEl, errorEl, show) {
      inputEl.classList.toggle('error', show);
      errorEl.classList.toggle('hidden', !show);
    }

    function validate() {
      let valid = true;
      const email = emailInput.value.trim();
      const pwd   = passInput.value;

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        showFieldError(emailInput, document.getElementById('emailError'), true);
        valid = false;
      } else {
        showFieldError(emailInput, document.getElementById('emailError'), false);
      }

      if (!pwd) {
        showFieldError(passInput, document.getElementById('passwordError'), true);
        valid = false;
      } else {
        showFieldError(passInput, document.getElementById('passwordError'), false);
      }
      return valid;
    }

    // Clear errors on input
    [emailInput, passInput].forEach(el => {
      el.addEventListener('input', () => {
        errorBanner.classList.add('hidden');
        el.classList.remove('error');
      });
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!validate()) return;

      // Show loading
      submitBtn.disabled = true;
      document.getElementById('submitLabel').classList.add('hidden');
      document.getElementById('submitSpinner').classList.remove('hidden');
      errorBanner.classList.add('hidden');

      // Simulate network delay (remove in production with real API)
      await new Promise(r => setTimeout(r, 600));

      const result = AUTH.login(emailInput.value.trim(), passInput.value);

      if (result.ok) {
        const dest = sessionStorage.getItem('fmk_redirect') || 'dashboard.html';
        sessionStorage.removeItem('fmk_redirect');
        window.location.href = dest;
      } else {
        errorMsg.textContent = result.error;
        errorBanner.classList.remove('hidden');
        submitBtn.disabled = false;
        document.getElementById('submitLabel').classList.remove('hidden');
        document.getElementById('submitSpinner').classList.add('hidden');
        passInput.value = '';
        passInput.focus();
      }
    });
  </script>
</body>
</html>
