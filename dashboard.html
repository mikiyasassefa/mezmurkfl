<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — ፈለገሕይወት መዝሙር ክፍል</title>
  <link rel="stylesheet" href="css/styles.css"/>
  <style>
    .recent-activity { display: flex; flex-direction: column; gap: var(--sp-3); }
    .activity-item {
      display: flex; align-items: flex-start; gap: var(--sp-3);
      padding: var(--sp-3) 0;
      border-bottom: 1px solid var(--clr-border-light);
    }
    .activity-item:last-child { border-bottom: none; }
    .activity-dot {
      width: 10px; height: 10px; border-radius: var(--r-full);
      flex-shrink: 0; margin-top: 5px;
    }
    .activity-dot.present { background: var(--clr-success); }
    .activity-dot.absent  { background: var(--clr-error); }
    .activity-dot.hymn    { background: var(--clr-accent-dark); }
    .activity-dot.equip   { background: var(--clr-info); }
    .activity-dot.student { background: var(--clr-primary); }
    .activity-text { flex: 1; }
    .activity-title { font-size: var(--fs-sm); font-weight: 600; }
    .activity-time  { font-size: var(--fs-xs); color: var(--clr-text-muted); }
    .quick-action-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-4); }
    .quick-action {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: var(--sp-2);
      padding: var(--sp-6) var(--sp-4);
      background: var(--clr-surface);
      border-radius: var(--r-xl);
      border: 2px solid var(--clr-border-light);
      text-align: center;
      transition: all var(--t-normal);
      text-decoration: none;
      color: var(--clr-text);
    }
    .quick-action:hover { border-color: var(--clr-primary); background: var(--clr-primary-xlight); transform: translateY(-2px); box-shadow: var(--shadow-md); }
    .quick-action svg { color: var(--clr-primary); }
    .quick-action span { font-size: var(--fs-xs); font-weight: 600; color: var(--clr-text-muted); }
    .class-breakdown { display: flex; flex-direction: column; gap: var(--sp-3); }
    .class-row { display: flex; align-items: center; gap: var(--sp-3); }
    .class-name { font-size: var(--fs-sm); font-weight: 600; min-width: 140px; font-family: var(--font-ethiopic); }
    .class-bar-wrap { flex: 1; }
    .class-count { font-size: var(--fs-xs); color: var(--clr-text-muted); min-width: 36px; text-align: right; }
    @media (max-width: 768px) {
      .quick-action-grid { grid-template-columns: repeat(3, 1fr); gap: var(--sp-3); }
      .class-name { min-width: 100px; font-size: var(--fs-xs); }
    }
  </style>
</head>
<body>
  <div id="appShell"></div>
  <div id="pageContent" style="display:none">

    <!-- Stats Cards -->
    <div class="grid-4 mb-6" id="statsGrid"></div>

    <div class="grid-2">
      <!-- Quick Actions -->
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">Quick Actions</div>
            <div class="card-subtitle">Common admin tasks</div>
          </div>
        </div>
        <div class="quick-action-grid">
          <a href="registration.html" class="quick-action" id="qaRegister">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
            <span>Register Student</span>
          </a>
          <a href="attendance.html" class="quick-action" id="qaAttendance">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
            <span>Take Attendance</span>
          </a>

          <a href="directory.html" class="quick-action" id="qaDirectory">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            <span>View Directory</span>
          </a>
          <a href="equipment.html" class="quick-action" id="qaEquip">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>
            <span>Equipment</span>
          </a>
          <a href="index.html" class="quick-action" id="qaHome">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Homepage</span>
          </a>
        </div>
      </div>

      <!-- Students by Class -->
      <div class="card">
        <div class="card-header">
          <div>
            <div class="card-title">Students by Class</div>
            <div class="card-subtitle">Enrollment breakdown</div>
          </div>
        </div>
        <div class="class-breakdown" id="classBreakdown"></div>
      </div>
    </div>

    <!-- Recent Activity -->
    <div class="card mt-6">
      <div class="card-header">
        <div>
          <div class="card-title">Recent Activity</div>
          <div class="card-subtitle">Latest updates across the program</div>
        </div>
      </div>
      <div class="recent-activity" id="recentActivity"></div>
    </div>

  </div>

    <script src="firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-sync.js"></script><script src="js/auth.js"></script>
  <script src="js/data.js"></script>
  <script src="js/nav.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      if (!AUTH.initProtectedPage()) return;
      DB.seed();
      CLOUD.init();
      await DB.pullFromCloud();
      NAV.init({ activePage: 'dashboard', pageTitle: 'Dashboard' });
      renderDashboard();
    });

    function renderDashboard() {
      const students   = DB.Students.all();
      const equipment  = DB.Equipment.all();
      const checkouts  = DB.Checkouts.active();
      const attendance = DB.Attendance.all();

      // Today's attendance rate (most recent session)
      const sessions = DB.Attendance.getSessionDates();
      let todayRate = '—';
      if (sessions.length) {
        const latest = attendance.filter(r => r.sessionDate === sessions[0]);
        const present = latest.filter(r => r.status === 'present').length;
        todayRate = latest.length ? Math.round((present / latest.length) * 100) + '%' : '—';
      }

      // Stats cards
      document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card">
          <div class="stat-icon primary">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg>
          </div>
          <div class="stat-info">
            <div class="stat-value">${students.length}</div>
            <div class="stat-label">Total Members</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon success">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          </div>
          <div class="stat-info">
            <div class="stat-value">${todayRate}</div>
            <div class="stat-label">Last Session Rate</div>
          </div>
        </div>
        <div class="stat-card">
          <div class="stat-icon warning">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/></svg>
          </div>
          <div class="stat-info">
            <div class="stat-value">${checkouts.length}</div>
            <div class="stat-label">Items on Loan</div>
          </div>
        </div>`;

      // Class breakdown bars
      const maxCount = Math.max(...DB.CLASSES.map(c => DB.Students.byClass(c).length), 1);
      document.getElementById('classBreakdown').innerHTML = DB.CLASSES.map(cls => {
        const count = DB.Students.byClass(cls).length;
        const pct   = Math.round((count / maxCount) * 100);
        return `
          <div class="class-row">
            <div class="class-name">${cls}</div>
            <div class="class-bar-wrap">
              <div class="progress-wrap">
                <div class="progress-bar" style="width:${pct}%"></div>
              </div>
            </div>
            <div class="class-count">${count}</div>
          </div>`;
      }).join('');

      // Recent activity (synthetic from real data)
      const recentStudents = [...students].sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).slice(0, 3);
      const activities = [
        ...recentStudents.map(s => ({
          dot: 'student',
          title: `${s.name} registered`,
          time: NAV.formatDate(s.createdAt),
          order: new Date(s.createdAt).getTime()
        })),
        ...(sessions.length ? [{
          dot: 'present',
          title: `Attendance recorded — ${NAV.formatDate(sessions[0])}`,
          time: `${attendance.filter(r => r.sessionDate === sessions[0] && r.status === 'present').length} present`,
          order: new Date(sessions[0]).getTime()
        }] : []),
        ...[]
      ].sort((a,b) => b.order - a.order).slice(0, 6);

      if (activities.length === 0) {
        document.getElementById('recentActivity').innerHTML = `<div class="text-muted text-sm" style="padding: var(--sp-4) 0">No recent activity yet.</div>`;
      } else {
        document.getElementById('recentActivity').innerHTML = activities.map(a => `
          <div class="activity-item">
            <div class="activity-dot ${a.dot}"></div>
            <div class="activity-text">
              <div class="activity-title">${a.title}</div>
              <div class="activity-time">${a.time}</div>
            </div>
          </div>`).join('');
      }
    }
  </script>
</body>
</html>
